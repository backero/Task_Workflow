name: Check CRO chat forwarding status (one-off)
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check bounce-guard forwarding + backend ingest logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "=== bounce-guard .env SAAS_WEBHOOK_* (lengths only) ==="
            BG_ENV=/opt/bounce-guard/.env
            for KEY in SAAS_WEBHOOK_URL SAAS_WEBHOOK_TOKEN; do
              VAL=$(grep "^${KEY}=" "$BG_ENV" | head -1 | cut -d= -f2-)
              echo "${KEY}: length=${#VAL}"
            done
            echo ""
            echo "=== backend .env BOUNCE_GUARD_SECRET (length only) ==="
            BE_ENV=/var/www/Task_Workflow/backero-backend/.env
            VAL=$(grep "^BOUNCE_GUARD_SECRET=" "$BE_ENV" | head -1 | cut -d= -f2-)
            echo "BOUNCE_GUARD_SECRET: length=${#VAL}"
            echo ""
            echo "=== diff check (both md5'd, not printed) ==="
            BG_TOKEN=$(grep "^SAAS_WEBHOOK_TOKEN=" "$BG_ENV" | cut -d= -f2-)
            BE_SECRET=$(grep "^BOUNCE_GUARD_SECRET=" "$BE_ENV" | cut -d= -f2-)
            if [ "$BG_TOKEN" = "$BE_SECRET" ]; then echo "MATCH: yes"; else echo "MATCH: no - MISMATCH"; fi
            echo ""
            echo "=== force restart with --update-env ==="
            pm2 restart bounce-guard --update-env
            sleep 2
            echo ""
            echo "=== pm2 exec cwd / script path for bounce-guard ==="
            pm2 describe bounce-guard | grep -E "exec cwd|script path|interpreter"
            echo ""
            echo "=== all .env files under likely bounce-guard locations ==="
            find /opt/bounce-guard -maxdepth 3 -iname ".env*" 2>/dev/null
            find /home -maxdepth 4 -iname ".env*" -path "*bounce*" 2>/dev/null
            find /root -maxdepth 4 -iname ".env*" -path "*bounce*" 2>/dev/null
            echo ""
            echo "=== pm2 jlist raw env snapshot for bounce-guard (SAAS_ keys only) ==="
            pm2 jlist 2>/dev/null | node -e "
              let d='';process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                try {
                  const start = d.indexOf('[');
                  const arr = JSON.parse(d.slice(start));
                  const p = arr.find(x => x.name === 'bounce-guard');
                  if (!p) { console.log('not found'); return; }
                  console.log('cwd:', p.pm2_env.pm_cwd || p.pm2_env.cwd);
                  console.log('pm_exec_path:', p.pm2_env.pm_exec_path);
                  console.log('SAAS_WEBHOOK_URL in pm2 env:', JSON.stringify(p.pm2_env.SAAS_WEBHOOK_URL));
                  console.log('SAAS_WEBHOOK_TOKEN length in pm2 env:', (p.pm2_env.SAAS_WEBHOOK_TOKEN||'').length);
                } catch(e) { console.log('parse error', e.message); }
              });
            "
            echo ""
            echo "=== sanity check: does dotenv correctly parse /opt/bounce-guard/.env? ==="
            cd /opt/bounce-guard && node -e "
              require('dotenv').config();
              console.log('SAAS_WEBHOOK_URL:', JSON.stringify(process.env.SAAS_WEBHOOK_URL));
              console.log('SAAS_WEBHOOK_TOKEN length:', (process.env.SAAS_WEBHOOK_TOKEN||'').length);
            "
            echo ""
            echo "=== bounce-guard log file mtimes vs process start time ==="
            ls -la --time-style=full-iso ~/.pm2/logs/bounce-guard-error.log ~/.pm2/logs/bounce-guard-out.log
            echo ""
            echo "=== pm2 process uptime / pid info ==="
            pm2 describe bounce-guard | grep -E "pid|uptime|restart time|status"
            echo ""
            echo "=== current server time ==="
            date -u
            echo ""
            echo "=== last 5 lines of each log (raw, no grep) ==="
            tail -5 ~/.pm2/logs/bounce-guard-error.log
            echo "---out---"
            tail -5 ~/.pm2/logs/bounce-guard-out.log
