name: Check WhatsApp Cloud send logs (one-off)
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tail recent [WhatsApp Cloud] log lines
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            pm2 logs backero-backend --lines 50 --nostream 2>/dev/null | grep -i "whatsapp cloud" | tail -10 || echo "no matching lines"
