name: Diagnose WhatsApp Cloud Config (one-off)
on: workflow_dispatch

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check WhatsApp Cloud env + recent errors (no secret values printed)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            ENV_FILE=/var/www/Task_Workflow/backero-backend/.env
            echo "=== Env presence (lengths only, no values) ==="
            for KEY in WHATSAPP_ENABLED WHATSAPP_CLOUD_ACCESS_TOKEN WHATSAPP_CLOUD_PHONE_NUMBER_ID WHATSAPP_CLOUD_BUSINESS_ACCOUNT_ID WHATSAPP_CLOUD_OTP_TEMPLATE WHATSAPP_WEBHOOK_VERIFY_TOKEN; do
              if grep -q "^${KEY}=" "$ENV_FILE"; then
                VAL=$(grep "^${KEY}=" "$ENV_FILE" | head -1 | cut -d= -f2-)
                echo "${KEY}: present, length=${#VAL}"
              else
                echo "${KEY}: MISSING"
              fi
            done
            echo ""
            echo "=== WHATSAPP_CLOUD_PHONE_NUMBER_ID value (not secret, just an ID) ==="
            grep "^WHATSAPP_CLOUD_PHONE_NUMBER_ID=" "$ENV_FILE" || echo "not set"
            echo ""
            echo "=== Recent [WhatsApp Cloud] log lines ==="
            pm2 logs backero-backend --lines 300 --nostream 2>/dev/null | grep -i "whatsapp cloud" | tail -40 || echo "no matching lines in last 300"
