name: Check low-stock alert logs (one-off)
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tail recent WhatsApp Cloud + low stock log lines
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            pm2 logs backero-backend --lines 80 --nostream 2>/dev/null | grep -iE "whatsapp cloud|low stock|cyclopentasiloxane" | tail -20 || echo "no matching lines"
