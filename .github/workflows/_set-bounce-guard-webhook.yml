name: Set Bounce Guard Webhook (one-off)
on: workflow_dispatch

jobs:
  set-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Point Bounce Guard at our ingest endpoint and restart it
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: SAAS_WEBHOOK_TOKEN
          script: |
            set -e
            ENV_FILE=/opt/bounce-guard/.env
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE not found"
              ls -la /opt/bounce-guard || true
              exit 1
            fi
            cp "$ENV_FILE" "$ENV_FILE.bak.$(date +%s)"

            SAAS_URL="http://127.0.0.1:5000/api/wa-chats/ingest"

            if grep -q '^SAAS_WEBHOOK_URL=' "$ENV_FILE"; then
              sed -i "s#^SAAS_WEBHOOK_URL=.*#SAAS_WEBHOOK_URL=${SAAS_URL}#" "$ENV_FILE"
            else
              echo "SAAS_WEBHOOK_URL=${SAAS_URL}" >> "$ENV_FILE"
            fi

            if grep -q '^SAAS_WEBHOOK_TOKEN=' "$ENV_FILE"; then
              sed -i "s#^SAAS_WEBHOOK_TOKEN=.*#SAAS_WEBHOOK_TOKEN=${SAAS_WEBHOOK_TOKEN}#" "$ENV_FILE"
            else
              echo "SAAS_WEBHOOK_TOKEN=${SAAS_WEBHOOK_TOKEN}" >> "$ENV_FILE"
            fi

            echo "SAAS_WEBHOOK_URL set to: ${SAAS_URL}"
            echo "SAAS_WEBHOOK_TOKEN set, length=${#SAAS_WEBHOOK_TOKEN}"

            echo "Restarting pm2 process: bounce-guard"
            pm2 restart bounce-guard
            sleep 2
            pm2 describe bounce-guard | grep -E "status|restart time" || true
            echo "=== recent bounce-guard logs ==="
            pm2 logs bounce-guard --lines 25 --nostream || true
        env:
          SAAS_WEBHOOK_TOKEN: ${{ secrets.BOUNCE_GUARD_SECRET_NEW }}
