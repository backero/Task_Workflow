name: Set WA Chats Secrets (one-off)
on: workflow_dispatch

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Write BOUNCE_GUARD_SECRET + WA_CHATS_ORG_ID, restart pm2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: BOUNCE_GUARD_SECRET,WA_CHATS_ORG_ID
          script: |
            set -e
            ENV_FILE=/var/www/Task_Workflow/backero-backend/.env
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE not found"; exit 1
            fi
            cp "$ENV_FILE" "$ENV_FILE.bak.$(date +%s)"

            if grep -q '^BOUNCE_GUARD_SECRET=' "$ENV_FILE"; then
              sed -i "s/^BOUNCE_GUARD_SECRET=.*/BOUNCE_GUARD_SECRET=${BOUNCE_GUARD_SECRET}/" "$ENV_FILE"
            else
              echo "BOUNCE_GUARD_SECRET=${BOUNCE_GUARD_SECRET}" >> "$ENV_FILE"
            fi

            if grep -q '^WA_CHATS_ORG_ID=' "$ENV_FILE"; then
              sed -i "s/^WA_CHATS_ORG_ID=.*/WA_CHATS_ORG_ID=${WA_CHATS_ORG_ID}/" "$ENV_FILE"
            else
              echo "WA_CHATS_ORG_ID=${WA_CHATS_ORG_ID}" >> "$ENV_FILE"
            fi

            echo "BOUNCE_GUARD_SECRET set, length=${#BOUNCE_GUARD_SECRET}"
            echo "WA_CHATS_ORG_ID set, length=${#WA_CHATS_ORG_ID}"

            pm2 restart backero-backend
            sleep 2
            pm2 describe backero-backend | grep -E "status|restart time" || true
        env:
          BOUNCE_GUARD_SECRET: ${{ secrets.BOUNCE_GUARD_SECRET_NEW }}
          WA_CHATS_ORG_ID: 6a02d20ccb2acc5941d6e79d
