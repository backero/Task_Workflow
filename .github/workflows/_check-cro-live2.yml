name: Check CRO live sync status (one-off)
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check bounce-guard activity + .env state
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "=== pm2 status / uptime ==="
            pm2 describe bounce-guard | grep -E "pid|uptime|status"
            echo ""
            echo "=== current live env in running process ==="
            BG_PID=$(pm2 jlist | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const s=d.indexOf('[');const a=JSON.parse(d.slice(s));const p=a.find(x=>x.name==='bounce-guard');console.log(p.pid)})" 2>/dev/null)
            echo "pid: $BG_PID"
            tr '\0' '\n' < /proc/$BG_PID/environ | grep -c "^SAAS_WEBHOOK_TOKEN="
            tr '\0' '\n' < /proc/$BG_PID/environ | grep "^SAAS_WEBHOOK_URL="
            echo ""
            echo "=== full recent error log (last 40, raw) ==="
            tail -40 ~/.pm2/logs/bounce-guard-error.log
            echo ""
            echo "=== full recent out log (last 40, raw) ==="
            tail -40 ~/.pm2/logs/bounce-guard-out.log
            echo ""
            echo "=== log file sizes/mtimes ==="
            ls -la --time-style=full-iso ~/.pm2/logs/bounce-guard-error.log ~/.pm2/logs/bounce-guard-out.log
            echo ""
            echo "=== current time ==="
            date -u
            echo ""
            echo "=== backend ingest logs (search wa-chats) ==="
            pm2 logs backero-backend --lines 300 --nostream 2>/dev/null | grep -i "wa-chats\|ingest" | tail -20 || echo "none"
