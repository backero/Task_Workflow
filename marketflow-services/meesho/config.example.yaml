# Meesho Seller Command Center - configuration
# This file is copied to data/config.yaml on first run. Edit data/config.yaml
# (or the Settings page) to change behaviour.

mode: demo                    # demo | manual | auto
pull_interval_hours: 2

meesho:
  phone: ""                   # seller registered mobile (display only; OTP done by human in opened browser)

alerts:
  sound: true
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 465
    username: ""
    password: ""
    to: ""
  whatsapp:                   # CallMeBot
    enabled: false
    phone: ""
    apikey: ""

thresholds:
  qs_warn: 15.0
  qs_block: 25.0
  rating_pause_sku: 3.7
  rating_discontinue: 3.4
  rating_ads_min: 4.0
  ctr_low_pct: 1.0            # with min_impressions_7d: 1000
  min_impressions_7d: 1000
  cvr_low_pct: 2.0            # with min_views_7d: 200
  min_views_7d: 200
  rto_high_pct: 10.0
  low_stock: 10
  dispatch_sla_min: 90.0
  ndd_sla_required: 97.0
  refresh_days: 45
  upload_gap_days: 15
  new_listing_days: 3
  qs_min_ratings: 20          # Quality Score from fewer ratings than this is reported as a weak signal, never a block
  title_min_chars: 60
  title_max_chars: 100
  block_cluster_min: 2        # this many blocked catalogues at once = account-level warning

selectors:                    # auto mode calibration points (documented as placeholders)
  catalog_rows: "table.catalog-list tr"
  quality_score: ".quality-score-value"
