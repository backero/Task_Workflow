[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's idiomatic Depends()/Query() in argument defaults triggers B008
# generically; these are immutable-per-call FastAPI constructs, not the
# mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "app.modules.workflow_auth.dependencies.require_workflow_role",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "app.tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["app/tests"]
