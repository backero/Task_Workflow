<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BACKERO BioTech - Product Lifecycle</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#013C58;--bg-card:#00537A;--bg-elevated:#014B6B;--bg-hover:#01698F;--bg-active:#0180A8;
  --accent:#F5A201;--accent-hover:#FFBA42;--accent-active:#D48A01;--accent-muted:#B87601;--accent-glow:rgba(245,162,1,0.15);
  --text:#F0F4F8;--text-secondary:#A8E8F9;--text-muted:#7AB8CC;--text-inverse:#013C58;
  --border:#014B6B;--border-active:#F5A201;--border-subtle:#003C55;
  --success:#5B9A3C;--success-bg:rgba(91,154,60,0.12);--success-glow:rgba(91,154,60,0.2);
  --danger:#C44B3E;--danger-bg:rgba(196,75,62,0.12);--danger-glow:rgba(196,75,62,0.2);
  --warning:#C48A2A;--warning-bg:rgba(196,138,42,0.12);--warning-glow:rgba(196,138,42,0.2);
  --info:#4A8BC2;--info-bg:rgba(74,139,194,0.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.03);
  --shadow:0 2px 8px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.04);
  --shadow-lg:0 4px 16px rgba(0,0,0,0.4),0 2px 4px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.04);
  --shadow-inset:inset 0 2px 4px rgba(0,0,0,0.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;background:var(--bg);color:var(--text);overflow:hidden}

.app{display:flex;height:100vh;width:100vw}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;width:100%}
.header{height:48px;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
.stagebar{background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;gap:4px;padding:8px 16px;flex-shrink:0;overflow-x:auto}
.content{flex:1;overflow-y:auto;padding:10px}
.content-inner{max-width:1200px;margin:0 auto}

/* Dashboard */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:10px;box-shadow:var(--shadow);transition:all .15s;cursor:pointer}
.kpi-card:hover{border-color:var(--accent-muted)}
.kpi-card .kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);font-weight:500}
.kpi-card .kpi-value{font-size:24px;font-weight:700;color:var(--accent);margin-top:4px;font-family:'SF Mono','Courier New',monospace}
.kpi-card .kpi-sub{font-size:10px;color:var(--text-secondary);margin-top:4px}
.kpi-card.kpi-success .kpi-value{color:var(--success)}
.kpi-card.kpi-danger .kpi-value{color:var(--danger)}
.kpi-card.kpi-warning .kpi-value{color:var(--warning)}
.kpi-card.kpi-info .kpi-value{color:var(--info)}
.pipeline-row{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:10px}
.pipe-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center;box-shadow:var(--shadow);transition:all .15s;cursor:pointer}
.pipe-card:hover{border-color:var(--accent-muted)}
.pipe-card .pipe-num{font-size:20px;font-weight:700;color:var(--accent);font-family:'SF Mono','Courier New',monospace}
.pipe-card .pipe-label{font-size:10px;color:var(--text-secondary);margin-top:4px;text-transform:uppercase;letter-spacing:0.3px}
.pipe-card .pipe-count{font-size:11px;color:var(--text-muted);margin-top:2px}
.pipe-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-glow)}
/* Dashboard Controls */
.dash-controls{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.dash-controls input,.dash-controls select{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-size:12px;outline:none}
.dash-controls input:focus,.dash-controls select:focus{border-color:var(--accent)}
.dash-controls input::placeholder{color:var(--text-muted)}
.dash-search{flex:1;min-width:200px}
.dash-filter{width:140px}
.dash-sort{width:160px}
table th.sortable{cursor:pointer;user-select:none}
table th.sortable:hover{color:var(--accent)}
table th.sortable::after{content:" \2195";font-size:9px;color:var(--text-muted)}
table th.sort-asc::after{content:" \2191";color:var(--accent)}
table th.sort-desc::after{content:" \2193";color:var(--accent)}
/* ALL STATUS STYLES -- must cover every possible status */
.status-draft{background:rgba(255,255,255,0.06);color:var(--text-secondary);border:1px solid var(--border)}
.status-pending{background:var(--warning-bg);color:var(--warning);border:1px solid var(--warning-glow)}
.status-active{background:var(--success-bg);color:var(--success);border:1px solid var(--success-glow)}
.status-urgent{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-glow)}
.status-released{background:var(--info-bg);color:var(--info);border:1px solid rgba(74,139,194,0.2)}
.status-production{background:var(--warning-bg);color:var(--warning);border:1px solid var(--warning-glow)}
.status-procurement{background:rgba(255,255,255,0.06);color:var(--text-secondary);border:1px solid var(--border)}
.status-dispatched{background:var(--success-bg);color:var(--success);border:1px solid var(--success-glow)}
.status-pre-qc{background:var(--info-bg);color:var(--info);border:1px solid rgba(74,139,194,0.2)}
.status-packaging{background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent-muted)}
.status-final-qc{background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent-muted)}
.status-in-pre-qc{background:var(--info-bg);color:var(--info);border:1px solid rgba(74,139,194,0.2)}
.status-released-to-packaging{background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent-muted)}
.status-released-for-dispatch{background:var(--success-bg);color:var(--success);border:1px solid var(--success-glow)}
.status-unknown{background:rgba(255,255,255,0.06);color:var(--text-secondary);border:1px solid var(--border)}
.status-in-progress{background:var(--warning-bg);color:var(--warning);border:1px solid var(--warning-glow)}
.status-completed{background:var(--success-bg);color:var(--success);border:1px solid var(--success-glow)}
.status-hold{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-glow)}

/* Header */
.brand-logo{font-size:15px;font-weight:700;letter-spacing:1px;color:var(--text)}
.brand-logo span{color:var(--accent)}
.nav-links{display:flex;gap:4px}
.nav-link{padding:5px 12px;border-radius:6px;font-size:12px;color:var(--text-secondary);text-decoration:none;transition:all .15s;cursor:pointer}
.nav-link:hover{background:var(--bg-hover);color:var(--text)}
.nav-link.active{background:var(--accent-glow);color:var(--accent)}
.header-right{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-muted)}
#currentOperator{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);box-shadow:var(--shadow-inset)}
#currentOperator:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow),var(--shadow-inset)}
.clock-live{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}

/* Stage Bar */
.stage-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text-secondary);cursor:pointer;transition:all .2s;font-size:12px;font-weight:500;white-space:nowrap}
.stage-btn:hover{background:var(--bg-hover);border-color:var(--accent-muted)}
.stage-btn.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.stage-btn.completed{border-color:var(--success);color:var(--success)}
.stage-btn.locked{opacity:0.5;cursor:not-allowed}
.stage-num{width:24px;height:24px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .2s}
.stage-btn.active .stage-num{background:var(--accent);color:var(--text-inverse)}
.stage-btn.completed .stage-num{background:var(--success);color:#fff}
.stage-btn.locked .stage-num{background:var(--bg);color:var(--text-muted)}

/* Cards */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,0.04)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;color:var(--text)}
.card-subtitle{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* Inputs */
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;color:var(--text);background:var(--bg-elevated);outline:none;transition:all .15s;box-shadow:var(--shadow-inset)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow),var(--shadow-inset)}
input::placeholder{color:var(--text-muted)}
label{display:block;font-size:11px;font-weight:500;color:var(--text-secondary);margin-bottom:4px}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.input-row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* Buttons */
.btn{padding:8px 16px;border-radius:8px;border:1px solid transparent;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--accent);color:var(--text-inverse);border:none}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 0 12px rgba(245,162,1,0.3)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-success:hover{filter:brightness(1.15)}
.btn-warning{background:var(--warning);color:#fff;border-color:var(--warning)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-danger:hover{filter:brightness(1.15)}
.btn-secondary{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg-hover);border-color:var(--border-active)}
.btn-sm{padding:5px 12px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:8px 10px;background:var(--bg);font-weight:600;color:var(--text-secondary);text-transform:uppercase;font-size:10px;letter-spacing:0.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border-subtle);vertical-align:middle;color:var(--text)}
tr:hover td{background:rgba(255,255,255,0.02)}

/* Status pills */
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.pill-success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-glow)}
.pill-danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-glow)}
.pill-warning{background:var(--warning-bg);color:var(--warning);border:1px solid var(--warning-glow)}
.pill-info{background:var(--info-bg);color:var(--info);border:1px solid rgba(74,139,194,0.2)}
.pill-default{background:rgba(255,255,255,0.05);color:var(--text-secondary);border:1px solid var(--border)}

/* Sign-off */
.signoff-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

/* Progress */
.prog-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;box-shadow:var(--shadow-inset)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent-muted),var(--accent));border-radius:3px;transition:width .4s ease}
.prog-text{font-size:11px;color:var(--text-muted);margin-top:4px}

/* Timeline */
.timeline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.tl-node{padding:4px 10px;border-radius:6px;background:var(--bg);color:var(--text-muted);font-weight:500;border:1px solid var(--border-subtle)}
.tl-node.done{background:var(--success-bg);color:var(--success);border-color:var(--success-glow)}
.tl-node.current{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.tl-arrow{color:var(--border);font-size:10px}

/* Step cards */
.step-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;transition:all .15s}
.step-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-glow)}
.step-card.done{border-color:var(--success)}
.step-card.locked{opacity:0.5}
.step-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step-num2{width:28px;height:28px;border-radius:50%;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:all .2s}
.step-card.active .step-num2{background:var(--accent);color:var(--text-inverse)}
.step-card.done .step-num2{background:var(--success);color:#fff}
.step-card.locked .step-num2{background:var(--bg);color:var(--text-muted)}
.step-title2{font-size:12px;font-weight:600;color:var(--text)}
.step-status{margin-left:auto;font-size:10px;font-weight:600}
.checklist-item{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--text-secondary);font-size:12px}
.checklist-item input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* Scale banner */
.scale-banner{background:linear-gradient(135deg,var(--accent-muted) 0%,var(--accent) 100%);color:#fff;border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:12px;font-size:13px;margin-bottom:10px;box-shadow:0 2px 8px rgba(245,162,1,0.25);flex-wrap:wrap}
/* Clickable order rows — hover anywhere on a customer row highlights it; click opens the order (no Open button) */
tbody tr.row-click{cursor:pointer;transition:background .12s}
tbody tr.row-click:hover td{background:rgba(245,162,1,0.14)}
tbody tr.row-click:active td{background:rgba(245,162,1,0.22)}
tr.cust-group-row td{background:rgba(245,162,1,0.07);font-size:11.5px;color:var(--text);padding:6px 10px;border-top:2px solid var(--border);font-weight:500}
.scale-banner strong{color:#fff;font-weight:700}

/* Counter */
.counter{background:var(--bg);border-radius:12px;padding:14px;text-align:center;border:2px solid var(--border);transition:all .2s}
.counter:hover{border-color:var(--accent-muted)}
.counter-num{font-size:36px;font-weight:700;color:var(--accent);font-family:'SF Mono','Courier New',monospace;text-shadow:0 0 20px rgba(245,162,1,0.3);transition:all .2s}
.counter-btns{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
/* CRM Read-Only Rows */
.crm-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border-subtle);font-size:11px}
.crm-row:last-child{border-bottom:none}
.crm-label{color:var(--text-muted);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;font-weight:500;flex-shrink:0;margin-right:12px}
.crm-value{color:var(--text);font-weight:500;text-align:right;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Label preview (light - printed label) */
.label-preview{background:#f5f0e8;color:#2C1810;border-radius:8px;padding:10px;font-family:Georgia,serif;border:1px solid #d4c5a9;box-shadow:var(--shadow-sm)}
.label-preview .lbl-brand{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;color:#2C1810}
.label-preview .lbl-name{font-size:10px;font-weight:600;margin-bottom:4px;color:#2C1810}
.label-preview .lbl-row{display:flex;justify-content:space-between;margin:2px 0;font-size:8px;color:#2C1810}

/* Toast */
#toastContainer{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 18px;border-radius:8px;color:#fff;font-size:12px;font-weight:500;animation:toastIn .3s,toastOut .3s 2.7s forwards;box-shadow:var(--shadow-lg);border:1px solid}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
.toast-success{background:var(--success);border-color:rgba(91,154,60,0.3)}
.toast-danger{background:var(--danger);border-color:rgba(196,75,62,0.3)}
.toast-warning{background:var(--warning);border-color:rgba(196,138,42,0.3)}

/* Section title */
.section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-secondary);margin:10px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border-subtle)}

/* Info rows */
.info-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.info-item{display:flex;flex-direction:column;gap:2px}
.info-label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);font-weight:500}
.info-value{font-size:13px;color:var(--text);font-weight:500}

/* Task items */
.task-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border-subtle);transition:background .15s}
.task-item:hover{background:rgba(255,255,255,0.02)}
.task-item:last-child{border-bottom:none}
.task-toggle{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;flex-shrink:0}
.task-toggle:hover{border-color:var(--accent);color:var(--accent)}
.task-body{flex:1}
.task-title{font-size:12px;font-weight:600;color:var(--text)}
.task-meta{font-size:10px;color:var(--text-muted);margin-top:1px}

/* Spec box */
.spec-box{background:var(--bg);border-radius:8px;padding:10px 14px;display:flex;gap:20px;flex-wrap:wrap}
.spec-item{display:flex;flex-direction:column;gap:2px}
.spec-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px}
.spec-value{font-size:13px;color:var(--accent);font-weight:600}

/* Empty state */
.empty-state{text-align:center;padding:40px;color:var(--text-muted);font-size:13px}
.empty-state-icon{font-size:32px;margin-bottom:8px}

/* Right panel */
.right-panel{display:grid;grid-template-columns:1fr 280px;gap:12px}
.panel-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;box-shadow:var(--shadow)}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-elevated);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--bg-hover)}

/* Utility */
.flex{display:flex;gap:8px;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.mt-8{margin-top:8px}.mt-12{margin-top:8px}.mb-8{margin-bottom:8px}
.text-right{text-align:right}.text-center{text-align:center}
.text-success{color:var(--success)}.text-danger{color:var(--danger)}.text-warning{color:var(--warning)}
.text-muted{color:var(--text-muted)}.text-secondary{color:var(--text-secondary)}
.font-mono{font-family:'SF Mono','Courier New',monospace;font-size:11px}

/* Deviation bar */
.dev-bar{height:4px;border-radius:2px;margin-top:2px;transition:all .2s}
.dev-bar-green{background:var(--success);width:100%}
.dev-bar-yellow{background:var(--warning);width:100%}
.dev-bar-red{background:var(--danger);width:100%}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9000;display:flex;align-items:center;justify-content:center}
.modal-overlay.wide{align-items:flex-start;padding-top:30px;padding-bottom:30px;overflow-y:auto}
.modal-content{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-content.wide-modal{max-width:1200px;width:90vw;max-height:none;overflow:visible}
.modal-title{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--text)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* New Order Modal Layout */

// ===== LEAD DAYS & PRIORITY =====
function calcLeadDays(order) {
  if(!order || !order.deliveryDate) return '--';
  var today = new Date();
  today.setHours(0,0,0,0);
  var delivery = new Date(order.deliveryDate);
  delivery.setHours(0,0,0,0);
  var diff = Math.ceil((delivery - today) / (1000 * 60 * 60 * 24));
  return diff;
}

function autoPriority(order) {
  var days = calcLeadDays(order);
  if(days === '--') return order.priority || 'Normal';
  days = parseInt(days);
  if(days <= 3) return 'Urgent';
  if(days <= 7) return 'High';
  if(days <= 14) return 'Normal';
  return 'Low';
}

function priorityColor(p) {
  if(p === 'Urgent') return 'pill-danger';
  if(p === 'High') return 'pill-warning';
  if(p === 'Low') return 'pill-default';
  return 'pill-success';
}

function getOrderStage(order) {
  var batches = appData.batches.filter(function(b) { return b.orderId === order.id; });
  if(batches.length === 0) return 'No Batch';
  var minStage = Math.min.apply(null, batches.map(function(b) { return b.stage; }));
  return STAGE_NAMES[minStage] || '--';
}

function getOrderBatch(order) {
  return appData.batches.find(function(b) { return b.orderId === order.id; });
}

// ===== HELPERS =====
function lsGet(key) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; } }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }
function escapeHtml(str) { if(!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nowISO() { return new Date().toISOString(); }
function fmtDate(iso) { if(!iso) return '--'; var d = new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function todayStr() { return new Date().toISOString().split('T')[0]; }
function getCat(pid) {
  if(CATALOGUE[pid]) return CATALOGUE[pid];
  // Runtime catalogue bridge: Form-15 exports the approved formula of each order here,
  // so the production hub can execute ANY order created from the Form-15 workflow.
  try {
    var extra = JSON.parse(localStorage.getItem('backero_v6_runtime_catalog') || '{}');
    if(extra && extra[pid]) return extra[pid];
  } catch(e) {}
  return null;
}
// ===== UNIVERSAL CUSTOMER ID (master anchor — shared with the Form-15 KYC store) =====
// The Customer ID (CUST-####) is UNIVERSAL: it is created once in the Form-15 KYC and every
// reference here — orders, batches, banners, documents — is anchored to that same ID.
var CUST_DB_KEY = 'sampleDevDB_v1';
function getCustomerDirectory() {
  try {
    var db = JSON.parse(localStorage.getItem(CUST_DB_KEY) || 'null');
    if(db && Array.isArray(db.customers)) return db.customers;
  } catch(e) {}
  return [];
}
function getUniversalCustomer(customerId) {
  if(!customerId) return null;
  var dir = getCustomerDirectory();
  for(var i = 0; i < dir.length; i++) { if(dir[i].customerId === customerId) return dir[i]; }
  return null;
}
// Resolve an order's customer against the universal directory (KYC is the source of truth)
function resolveOrderCustomer(order) {
  var u = order && order.customerId ? getUniversalCustomer(order.customerId) : null;
  return {
    linked: !!u,
    id: order && order.customerId ? order.customerId : '',
    name: u ? (u.name || u.contact || order.customer) : (order ? order.customer : ''),
    contact: u ? (u.phone || u.whatsapp || u.email || '') : (order ? order.contact || '' : ''),
    email: u ? (u.email || '') : (order ? order.email || '' : ''),
    city: u ? (u.city || '') : (order ? order.city || '' : ''),
    contactPerson: u ? (u.contact || '') : (order ? order.contactPerson || '' : '')
  };
}
function custDisplay(order) { // "CUST-0001 — Nykaa" or just the name when unlinked

}

// Link legacy orders (created before universal IDs) to the directory by exact name match,
// and refresh every linked order's baseline from the KYC master record. Returns link count.
function syncCustomerLinks() {
  var dir = getCustomerDirectory();
  var linked = 0, changed = false;
  appData.orders.forEach(function(o) {
    var u = o.customerId ? getUniversalCustomer(o.customerId) : null;
    if(!u && o.customer && dir.length) {
      var needle = String(o.customer).trim().toLowerCase();
      for(var i = 0; i < dir.length; i++) {
        var nm = String(dir[i].name || '').trim().toLowerCase();
        var cp = String(dir[i].contact || '').trim().toLowerCase();
        if(needle && (needle === nm || needle === cp)) { o.customerId = dir[i].customerId; u = dir[i]; linked++; changed = true; break; }
      }
    }
    if(u) { // KYC master record wins — baseline is always inherited, never typed here
      var nm2 = u.name || u.contact || o.customer;
      var ct2 = u.phone || u.whatsapp || u.email || o.contact || '';
      if(o.customer !== nm2 || o.contact !== ct2) { o.customer = nm2; o.contact = ct2; changed = true; }
      if(u.email && !o.email) { o.email = u.email; changed = true; }
      if(u.city && !o.city) { o.city = u.city; changed = true; }
      if(u.contact && !o.contactPerson) { o.contactPerson = u.contact; changed = true; }
    }
  });
  if(changed) lsSet(STORE.orders, appData.orders);
  return linked;
}

// Form-15 store and compounded to the required batch weight. Falls back to the runtime/catalogue.
function getConfirmedFormulaCat(order) {
  if(!order || !order.formulaId || !order.formulaVersionId) return null;
  try {
    var db = JSON.parse(localStorage.getItem(CUST_DB_KEY) || 'null');
    if(!db) return null;
    var f = (db.formulas || []).find(function(x) { return x.formulaId === order.formulaId; });
    if(!f) return null;
    var v = (f.versions || []).find(function(x) { return x.versionId === order.formulaVersionId; });
    if(!v || !Array.isArray(v.rows) || !v.rows.length) return null;
    var ings = v.rows.map(function(r) {
      var baseQty = ((parseFloat(r.percentage) || 0) / 100) * 10000 * (parseFloat(r.conv) || 1); // per 10kg base
      var unit = (r.unit || 'g').toLowerCase();
      if(unit === 'kg') { baseQty *= 1000; unit = 'g'; }
      if(unit === 'ml') unit = 'g'; // density ≈ 1
      return { code: r.code || r.name || 'RM-???', name: r.name || r.code || 'Material', baseQty: Math.round(baseQty * 100) / 100, unit: unit, phase: r.phase || 'Water', temp: '—' };
    });
    return { name: f.name || order.productName, brand: order.brand || 'CUSTOM', phMin: 4.5, phMax: 6.5, shelfLife: 12,
             ingredients: ings, formulaId: f.formulaId, versionId: v.versionId,
             versionLabel: order.versionLabel || ('V' + (v.versionNo || '?')), versionStatus: v.status || 'Locked' };
  } catch(e) { return null; }
}

  t.textContent = msg;

// PAYMENT GATE: Form-15 orders are proformas until the production advance is confirmed
// in the shared Orders tab. Production MUST NOT execute an unconfirmed order.
function isOrderPaymentConfirmed(order) {
  if(!order || order.source !== 'form15') return true; // hub-created orders are not gated
  return order.paymentStatus === 'Paid';
}

function createBatchForOrder(orderId) {
  var order = appData.orders.find(function(o) { return o.id === orderId; });
  if(!order) return;
  if(!isOrderPaymentConfirmed(order)) { toast('Order ' + orderId + ' is LOCKED — production advance not yet confirmed in the Form-15 Orders tab', 'danger'); return; }
  var cat = getCat(order.productId);
  if(!cat) { toast('Product not found in catalogue', 'danger'); return; }
  var batchId = 'B-' + Math.random().toString(36).substr(2, 6).toUpperCase();
  var factor = order.batchSizeKg / 10;
  var batch = { id: batchId, orderId: orderId, productId: order.productId, productName: cat.name, brand: cat.brand, batchSizeKg: order.batchSizeKg, factor: factor, stage: 1, stepsCompleted: [0,0,0,0,0,0,0,0], status: 'In Progress', createdAt: nowISO() };
  appData.batches.push(batch);
  lsSet(STORE.batches, appData.batches);
  selectOrder(orderId);
}

function selectBatch(id) {
  selectedBatchId = id;
  var batch = appData.batches.find(function(b) { return b.id === id; });
  activeStage = batch ? batch.stage : 0;
  document.getElementById('stageBar').style.display = 'flex';
  document.getElementById('backToDashBtn').style.display = 'inline-flex';
  renderStageBar();
  goStage(activeStage);
}

function getCounts() {
  var c = { total:0, order:0, procurement:0, workAssign:0, weighing:0, bulkQC:0, packaging:0, finalQC:0, dispatch:0, completed:0 };
  appData.batches.forEach(function(b) {
    c.total++;
    if(b.stage === 0) c.order++;
    else if(b.stage === 1) c.workAssign++;
    else if(b.stage === 2) c.procurement++;
    else if(b.stage === 3) c.weighing++;
    else if(b.stage === 4) c.bulkQC++;
    else if(b.stage === 5) c.packaging++;
    else if(b.stage === 6) c.finalQC++;
    else if(b.stage === 7) { c.dispatch++; c.completed++; }
  });
  // Orders with no batch yet sit at the "Order" stage tab
  appData.orders.forEach(function(o) {
    var has = appData.batches.some(function(b) { return b.orderId === o.id; });
    if(!has) { c.total++; c.order++; }
  });
  return c;
}

function getProgressPct(batch) {
  if(!batch.stepsCompleted) return 0;
  var done = batch.stepsCompleted.filter(function(s) { return s === 1; }).length;
  return Math.round((done / batch.stepsCompleted.length) * 100);
}

        ' &nbsp;&middot;&nbsp; <strong>' + g.items.length + ' order' + (g.items.length === 1 ? '' : 's') + '</strong></td></tr>';

      var locked = !isOrderPaymentConfirmed(o);

      else if(b) {

  }

  el.innerHTML = html;
}

function setSort(col) {
  if(dashSort.col === col) {
    dashSort.dir = dashSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    dashSort.col = col;
    dashSort.dir = 'asc';
  }
  renderDashboard();
}

function jumpToStage(stageIdx) {
  // "Order" stage holds orders with no batch yet
  if(stageIdx === 0) {
    var waiting = appData.orders.find(function(o) { return !appData.batches.some(function(b) { return b.orderId === o.id; }); });
    if(!waiting) { toast('No orders waiting at Order stage', 'warning'); return; }
    selectOrder(waiting.id);
    return;
  }
  // Find first batch at this stage, then select its parent order
  var batchesAtStage = appData.batches.filter(function(b) { return b.stage === stageIdx; });
  if(batchesAtStage.length === 0) {
    toast('No batches at ' + STAGE_NAMES[stageIdx], 'warning');
    return;
  }
  var targetBatch = batchesAtStage[0];
  selectOrder(targetBatch.orderId);
}

function getSelectedBatch() {
  return appData.batches.find(function(b) { return b.id === selectedBatchId; }) || null;
}

// ===== STAGE BAR =====
function renderStageBar() {
  try {
    var el = document.getElementById('stageBar');
    var batch = getSelectedBatch();
    if(!batch) { el.innerHTML = ''; return; }
    el.innerHTML = '';
    for(var i = 0; i < 8; i++) {
      var btnClass = 'stage-btn';
      var clickable = true;
      if(i === activeStage) { btnClass += ' active'; }
      else if(i < batch.stage) { btnClass += ' completed'; }
      else if(i > batch.stage) { btnClass += ' locked'; clickable = false; }
      var icon = i < batch.stage ? '&#10003;' : (i + 1);
      var btnHtml = '<div class="' + btnClass + '"><span class="stage-num">' + icon + '</span> ' + escapeHtml(STAGE_NAMES[i]) + '</div>';
      if(clickable) {
        el.innerHTML += btnHtml.replace('<div class="' + btnClass + '">', '<div class="' + btnClass + '" onclick="goStage(' + i + ')">');
      } else {
        el.innerHTML += btnHtml;
      }
    }
  } catch(e) { console.error('renderStageBar error:', e); }
}

// ===== STAGE NAVIGATION =====
function goStage(n) {
  try {
    activeStage = n;
    renderStageBar();
    var el = document.getElementById('contentInner');
    var batch = getSelectedBatch();
    if(!batch) { el.innerHTML = '<div class="card"><div class="empty-state"><div class="empty-state-icon">&#128230;</div>Select a batch</div></div>'; return; }
    if(n > batch.stage) { el.innerHTML = '<div class="lock-msg">&#128274;<br><br><strong>Stage Locked</strong><br>Complete ' + STAGE_NAMES[batch.stage] + ' to unlock ' + STAGE_NAMES[n] + '</div>'; return; }
    switch(n) {
      case 0: renderStage0(el, batch); break;
      case 1: renderStage2(el, batch); break; // stage 1 = Work Assignment
      case 2: renderStage1(el, batch); break; // stage 2 = Procurement
      case 3: renderStage3(el, batch); break;
      case 4: renderStage4(el, batch); break;
      case 5: renderStage5(el, batch); break;
      case 6: renderStage6(el, batch); break;
      case 7: renderStage7(el, batch); break;
      default: renderStage0(el, batch);
    }
  } catch(e) { console.error('goStage error:', e); el.innerHTML = '<div class="card">Error loading stage</div>'; }
}

function advanceStage(batchId) {
  try {
    var batch = appData.batches.find(function(b) { return b.id === batchId; });
    if(!batch) return;
    if(batch.stage >= 7) { toast('Batch is already at final stage', 'success'); return; }
    batch.stage += 1;
    lsSet(STORE.batches, appData.batches);
    renderStageBar();
    goStage(batch.stage);
    toast('Advanced to ' + STAGE_NAMES[batch.stage], 'success');
  } catch(e) { console.error('advanceStage error:', e); toast('Error advancing stage', 'danger'); }
}

// Backward-compat: if new _status key doesn't exist, default to 'Required'
// so old data (where everything was implicitly required) still works
function getSpecStatus(crm, statusKey) {
  if(crm[statusKey]) return crm[statusKey];
  // If no new-style status set, check if there's any old-style key
  // e.g. qcStatus='yes' meant it was active -> default Required
  var oldKey = statusKey.replace('Status', '');
  if(crm[oldKey + 'Status'] === 'yes' || crm[oldKey + 'Status'] === 'Required') return 'Required';
  if(crm[oldKey + 'Status'] === 'no' || crm[oldKey + 'Status'] === 'Not Required') return 'Not Required';
  // Default: if spec value exists, assume Required; otherwise Required as default
  var specKey = statusKey.replace('Status', 'Spec');
  if(crm[specKey]) return 'Required';
  return 'Required';
}

// ===== STAGE 3: WEIGHING (Production Steps) =====
function renderStage3(el, batch) {
  try {
    var order = appData.orders.find(function(o) { return o.id === batch.orderId; }) || {};
    // REQ: pull the CONFIRMED formula version (locked in Form-15) live — else runtime/hard catalogue
    var fsrc = getConfirmedFormulaCat(order);
    var cat = fsrc || getCat(batch.productId);
    if(!cat) { el.innerHTML = '<div class="card">Product not found</div>'; return; }
    var factor = batch.factor || 1;
    var weighingData = lsGet(STORE.weighing) || {};
    var recorded = weighingData[batch.id] || {};
    var stepsCompleted = batch.stepsCompleted || [0,0,0,0,0,0,0,0];

    var html = '<div class="scale-banner"><strong>&#9878; WEIGHING</strong>' + custBannerSpan(order) + '<span>' + escapeHtml(batch.productName) + '</span><span>Batch: ' + batch.id + '</span><span>Target: ' + batch.batchSizeKg + 'kg</span></div>';

    // Provenance + weight reconciliation (formula targets must equate to the required batch weight)
    var totalTarget = 0;
    cat.ingredients.forEach(function(ing) { totalTarget += Math.round(ing.baseQty * factor); });
    var required = Math.round((batch.batchSizeKg || 0) * 1000);
    var diff = required - totalTarget;
    var balanced = Math.abs(diff) <= Math.max(1, Math.round(required * 0.005));
    if(fsrc) {
      html += '<div class="card" style="border-color:var(--accent)"><div style="font-size:12px"><strong style="color:var(--accent)">&#129516; Formula ' + escapeHtml(fsrc.formulaId) + ' &middot; ' + escapeHtml(fsrc.versionLabel) + '</strong> <span class="pill pill-success" style="font-size:9px">' + escapeHtml(fsrc.versionStatus) + ' &#128274;</span> &mdash; confirmed version pulled live from Form-15 Products/Formulas, compounded for the required weight.</div></div>';
    }
    html += '<div class="card" style="border-color:' + (balanced ? 'var(--success)' : 'var(--danger)') + ';padding:8px 12px"><div style="font-size:11.5px">&#9878; <strong>Compounding check:</strong> required batch weight <strong class="font-mono">' + required.toLocaleString('en-IN') + ' g</strong> &nbsp;vs&nbsp; &Sigma; formula targets <strong class="font-mono">' + totalTarget.toLocaleString('en-IN') + ' g</strong> &nbsp;&rarr;&nbsp; ' + (balanced ? '<span class="text-success"><strong>&#10003; Equates</strong> (within tolerance)</span>' : '<span style="color:var(--danger)"><strong>&#9888; Short by ' + diff.toLocaleString('en-IN') + ' g</strong> — verify formula percentages sum to 100%</span>') + '</div></div>';

    // RM Low Stock Check
    var lowStock = [];
    cat.ingredients.forEach(function(ing) {
      var scaled = Math.round(ing.baseQty * factor);
      var stock = RAW_MATERIAL_STOCK[ing.code] || 0;
      if(stock < scaled) lowStock.push(ing.name + ' (need ' + scaled + 'g, have ' + stock + 'g)');
    });
    if(lowStock.length > 0) {
      html += '<div class="card" style="border-color:var(--danger)"><div class="card-title" style="color:var(--danger)">&#9888; Low Raw Material Stock</div><div style="font-size:12px;color:var(--text-secondary);margin-top:8px">The following raw materials are below required quantity:</div><ul style="margin:8px 0;padding-left:20px;color:var(--danger);font-size:12px">';
      lowStock.forEach(function(item) { html += '<li>' + escapeHtml(item) + '</li>'; });
      html += '</ul></div>';
    }

    // Ingredient Weighing Table
    var allWeighed = true;
    var weighedCount = 0;
    cat.ingredients.forEach(function(ing) { if(recorded[ing.code]) weighedCount++; else allWeighed = false; });
    var wDone = allWeighed;
    var wCardClass = wDone ? 'step-card done' : 'step-card active';

    html += '<div class="' + wCardClass + '"><div class="step-header"><div class="step-num2">1</div><div class="step-title2">Ingredient Weighing</div><div class="step-status">' + (wDone ? '<span class="text-success">&#10003; Complete (' + weighedCount + '/' + cat.ingredients.length + ')</span>' : '<span class="text-warning">&#9208; In Progress (' + weighedCount + '/' + cat.ingredients.length + ')</span>') + '</div></div>';

    html += '<table style="margin-top:8px"><thead><tr><th>RM Code</th><th>Material</th><th>Phase</th><th>Target</th><th>Status</th><th style="width:40px;text-align:center"></th></tr></thead><tbody>';
    cat.ingredients.forEach(function(ing) {
      var target = Math.round(ing.baseQty * factor);
      var rec = recorded[ing.code];
      var dangerLabel = ing.danger ? ' <span class="pill pill-danger" style="font-size:8px">DANGER</span>' : '';
      var sensLabel = ing.sensitive ? ' <span class="pill pill-warning" style="font-size:8px">SENSITIVE</span>' : '';
      var stock = RAW_MATERIAL_STOCK[ing.code] || 0;
      var lowWarn = stock < target ? ' <span class="pill pill-danger" style="font-size:8px">LOW STOCK</span>' : '';
      if(rec) {
        html += '<tr><td class="font-mono">' + escapeHtml(ing.code) + '</td><td>' + escapeHtml(ing.name) + dangerLabel + sensLabel + lowWarn + '</td><td>' + escapeHtml(ing.phase) + '</td><td class="font-mono">' + target + ' ' + ing.unit + '</td><td><span class="pill pill-success">Weighed</span></td><td style="text-align:center"><span class="text-success">&#10003;</span></td></tr>';
      } else {
        html += '<tr><td class="font-mono">' + escapeHtml(ing.code) + '</td><td>' + escapeHtml(ing.name) + dangerLabel + sensLabel + lowWarn + '</td><td>' + escapeHtml(ing.phase) + '</td><td class="font-mono">' + target + ' ' + ing.unit + '</td><td><span class="pill pill-warning">Pending</span></td><td style="text-align:center"><input type="checkbox" title="Confirm weighed" onclick="toggleWeighed(\'' + escapeHtml(ing.code) + '\')"></td></tr>';
      }
    });
    html += '</tbody></table></div>';

    // Procedure from Catalogue
    html += '<div class="card"><div class="card-title">&#128221; Procedure</div><div style="font-size:12px;color:var(--text-secondary);margin-top:8px">Auto-populated from product catalogue for <strong style="color:var(--accent)">' + escapeHtml(cat.name) + '</strong></div>';
    html += '<div style="margin-top:12px">';
    var phaseGroups = {};
    cat.ingredients.forEach(function(ing) { if(!phaseGroups[ing.phase]) phaseGroups[ing.phase] = []; phaseGroups[ing.phase].push(ing); });
    Object.keys(phaseGroups).forEach(function(phase) {
      html += '<div style="margin-bottom:10px"><strong style="color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:0.5px">' + escapeHtml(phase) + ' Phase</strong> <span style="color:var(--text-muted);font-size:10px">(' + phaseGroups[phase][0].temp + ')</span><div style="font-size:11px;color:var(--text-secondary);margin-top:2px">';
      phaseGroups[phase].forEach(function(ing) { html += escapeHtml(ing.name) + ' (' + Math.round(ing.baseQty * factor) + 'g), '; });
      html = html.slice(0, -2) + '</div></div>';
    });
    html += '</div></div>';

    // Process Steps 2-9
    var prodSteps = lsGet(STORE.prodsteps) || {};
    var stepSigs = prodSteps[batch.id] || {};
    var allProcDone = wDone;
    PRODUCTION_STEPS.forEach(function(stepName, i) {
      var stepNum = i + 2;
      var isDone = stepsCompleted[i] === 1;
      var isActive = wDone && !isDone && (i === 0 || stepsCompleted[i-1] === 1);
      var cardClass = isDone ? 'step-card done' : isActive ? 'step-card active' : 'step-card locked';
      var sig = stepSigs['step' + i];
      if(!isDone) allProcDone = false;
      html += '<div class="' + cardClass + '"><div class="step-header"><div class="step-num2">' + stepNum + '</div><div class="step-title2">' + escapeHtml(stepName) + '</div><div class="step-status">' + (isDone ? '<span class="text-success">&#10003; Complete</span>' : isActive ? '<span class="text-warning">&#9208; In Progress</span>' : '<span class="text-muted">&#128274; Locked</span>') + '</div></div>';
      if(isDone && sig) { html += '<div style="font-size:11px;color:var(--text-secondary)">Completed at ' + fmtDate(sig.at) + '</div>'; }
      if(isActive) {
        html += '<div class="checklist-item"><input type="checkbox" id="chk-' + i + '-1"><label for="chk-' + i + '-1" style="display:inline;margin:0;font-weight:400">Equipment sanitized and ready</label></div>';
        html += '<div class="checklist-item"><input type="checkbox" id="chk-' + i + '-2"><label for="chk-' + i + '-2" style="display:inline;margin:0;font-weight:400">Process parameters set and verified</label></div>';
        html += '<div class="checklist-item"><input type="checkbox" id="chk-' + i + '-3"><label for="chk-' + i + '-3" style="display:inline;margin:0;font-weight:400">Temperature and conditions monitored</label></div>';
        html += '<div class="mt-8"><button class="btn btn-success btn-sm" onclick="completeProdStep(' + i + ')">Mark Step Complete</button></div>';
      }
      html += '</div>';
    });

    if(allProcDone) {
      html += '<div class="card" style="border-color:var(--success)"><div class="flex-between"><div><div class="card-title">&#9989; All Steps Complete</div><div class="card-subtitle">Ready for Bulk QC</div></div><button class="btn btn-primary" onclick="advanceStage(\'' + batch.id + '\')">Complete &rarr; Bulk QC</button></div></div>';
    }
    el.innerHTML = html;
  } catch(e) { console.error('renderStage3 error:', e); el.innerHTML = '<div class="card">Error: ' + escapeHtml(e.message) + '</div>'; }
}

function toggleWeighed(rmCode) {
  try {
    var batch = getSelectedBatch();
    if(!batch) return;
    var weighingData = lsGet(STORE.weighing) || {};
    if(!weighingData[batch.id]) weighingData[batch.id] = {};
    weighingData[batch.id][rmCode] = { at: nowISO() };
    lsSet(STORE.weighing, weighingData);
    renderStage3(document.getElementById('contentInner'), batch);
    toast(rmCode + ' marked as weighed', 'success');
  } catch(e) { console.error('toggleWeighed error:', e); toast('Error', 'danger'); }
}

function completeProdStep(idx) {
  try {
    var batch = getSelectedBatch();
    if(!batch) return;
    var chk1 = document.getElementById('chk-' + idx + '-1');
    var chk2 = document.getElementById('chk-' + idx + '-2');
    var chk3 = document.getElementById('chk-' + idx + '-3');
    if(!chk1 || !chk1.checked || !chk2 || !chk2.checked || !chk3 || !chk3.checked) { toast('Complete all checklist items', 'warning'); return; }
    if(!batch.stepsCompleted) batch.stepsCompleted = [0,0,0,0,0,0,0,0];
    batch.stepsCompleted[idx] = 1;
    lsSet(STORE.batches, appData.batches);
    var prodSteps = lsGet(STORE.prodsteps) || {};
    if(!prodSteps[batch.id]) prodSteps[batch.id] = {};
    prodSteps[batch.id]['step' + idx] = { at: nowISO() };
    lsSet(STORE.prodsteps, prodSteps);
    renderStage3(document.getElementById('contentInner'), batch);
    toast('Step ' + (idx + 2) + ' complete', 'success');
  } catch(e) { console.error('completeProdStep error:', e); toast('Error', 'danger'); }
}

function saveBulkQC(pass) {
  try {
    var batch = getSelectedBatch();
    if(!batch) return;
    var crm = getOrderCRM(batch);
    var preqcData = lsGet(STORE.preqc) || {};
    var rec = { result: pass ? 'PASS' : 'FAIL', at: nowISO() };
    var elPh = document.getElementById('bqcPh');
    if(elPh) rec.ph = parseFloat(elPh.value) || elPh.value;
    var elVisc = document.getElementById('bqcVisc');
    if(elVisc) rec.viscosity = elVisc.value;
    var elDens = document.getElementById('bqcDens');
    if(elDens) rec.density = elDens.value;
    var elAppear = document.getElementById('bqcAppear');
    if(elAppear) rec.appearance = elAppear.value;
    var elColor = document.getElementById('bqcColor');
    if(elColor) rec.color = elColor.value;
    var elOdor = document.getElementById('bqcOdor');
    if(elOdor) rec.odor = elOdor.value;
    var elTexture = document.getElementById('bqcTexture');
    if(elTexture) rec.texture = elTexture.value;
    var elTpc = document.getElementById('bqcTpc');
    if(elTpc) rec.tpc = elTpc.value;
    var elYm = document.getElementById('bqcYm');
    if(elYm) rec.ym = elYm.value;
    var elPathogen = document.getElementById('bqcPathogen');
    if(elPathogen) rec.pathogen = elPathogen.value;
    var elWld = document.getElementById('bqcWld');
    if(elWld) rec.wld = elWld.value;
    var elHeavy = document.getElementById('bqcHeavy');
    if(elHeavy) rec.heavy = elHeavy.value;
    var elPreservative = document.getElementById('bqcPreservative');
    if(elPreservative) rec.preservative = elPreservative.value;
    var elStability = document.getElementById('bqcStability');
    if(elStability) rec.stability = elStability.value;
    var elDocs = document.getElementById('bqcDocs');
    if(elDocs) rec.docs = elDocs.value;
    if(crm.qcExtra && crm.qcExtra.length > 0) {
      crm.qcExtra.forEach(function(extra, idx) {
        if(extra.status === 'Required') {
          var elExtra = document.getElementById('bqcExtra_' + idx);
          if(elExtra) rec['extra_' + idx] = elExtra.value;
        }
      });
    }
    preqcData[batch.id] = rec;
    lsSet(STORE.preqc, preqcData);
    if(pass) {
      batch.stage = 5;
      lsSet(STORE.batches, appData.batches);
      renderStageBar();
      goStage(5);
      toast('Bulk QC passed', 'success');
    } else {
      toast('Batch HELD', 'danger');
    }
  } catch(e) { console.error('saveBulkQC error:', e); toast('Error saving QC', 'danger'); }
}

// ===== STAGE 5: PACKAGING (Pre-populated from Job Sheet) =====

function adjustFill(delta) { var el = document.getElementById('pkCounter'); var val = parseInt(el.textContent) + delta; if(val < 0) val = 0; el.textContent = val; calcYield(); calcCartons(); }
function calcExpected() { var bw = parseFloat(document.getElementById('pkBatchWeight').value) || 0; var fw = parseFloat(document.getElementById('pkFillWeight').value) || 0; var el = document.getElementById('pkExpected'); if(el) el.textContent = (fw && bw) ? Math.floor(bw / fw) : '--'; }
function calcYield() { var filled = parseInt(document.getElementById('pkCounter').textContent) || 0; var rej = parseInt(document.getElementById('pkRejected').value) || 0; var total = filled + rej; var el = document.getElementById('pkYield'); if(el) el.value = total > 0 ? ((filled / total) * 100).toFixed(1) + '%' : '0.0%'; }
function calcCartons() { var filled = parseInt(document.getElementById('pkCounter').textContent) || 0; var cq = parseInt(document.getElementById('pkUnitsPerCarton').value) || 0; var el = document.getElementById('pkTotalCartons'); if(el) el.value = (filled && cq) ? Math.ceil(filled / cq) : '--'; }
function calcExp() { var mfg = document.getElementById('pkMfg').value; var batch = getSelectedBatch(); if(!mfg || !batch) return; var cat = getCat(batch.productId); if(!cat) return; var d = new Date(mfg); d.setMonth(d.getMonth() + (cat.shelfLife || 12)); var el = document.getElementById('pkExp'); if(el) el.value = d.toISOString().split('T')[0]; }

function savePackaging() {
  try {
    var batch = getSelectedBatch();
    if(!batch) return;
    var packData = lsGet(STORE.pack) || {};
    packData[batch.id] = {
      container: document.getElementById('pkContainerType').value,
      cap: document.getElementById('pkCap').value,
      label: document.getElementById('pkLabel').value,
      fillWeight: document.getElementById('pkFillWeight').value,
      mrp: document.getElementById('pkMrp').value,
      batchWeight: document.getElementById('pkBatchWeight').value,
      filled: parseInt(document.getElementById('pkCounter').textContent) || 0,
      rejected: parseInt(document.getElementById('pkRejected').value) || 0,
      primaryMonoCarton: document.getElementById('pkPrimaryMonoCarton').value,
      primaryShrinkWrap: document.getElementById('pkPrimaryShrinkWrap').value,
      primaryLeaflet: document.getElementById('pkPrimaryLeaflet').value,
      secondaryOuterCarton: document.getElementById('pkSecondaryOuterCarton').value,
      unitsPerCarton: document.getElementById('pkUnitsPerCarton').value,
      totalCartons: document.getElementById('pkTotalCartons').value,
      secondaryShrinkWrap: document.getElementById('pkSecondaryShrinkWrap').value,
      palletInfo: document.getElementById('pkPalletInfo').value,
      specialHandling: document.getElementById('pkSpecialHandling').value,

      expDate: document.getElementById('pkExp').value,
      batchCode: document.getElementById('pkBatchCode').value,
      at: nowISO()
    };
    lsSet(STORE.pack, packData);
    batch.stage = 6;
    lsSet(STORE.batches, appData.batches);
    renderStageBar();
    goStage(6);
    toast('Packaging complete', 'success');
  } catch(e) { console.error('savePackaging error:', e); toast('Error', 'danger'); }
}

function saveFinalQC(approve) {
  try {
    var batch = getSelectedBatch();
    if(!batch) return;
    var crm = getOrderCRM(batch);
    var result = { date: todayStr(), time: new Date().toTimeString().slice(0, 5) };
    var elWeight = document.getElementById('fqcWeight');
    result.weightCheck = (elWeight && elWeight.value) || 'N/A';
    var elSeal = document.getElementById('fqcSeal');
    result.sealCheck = (elSeal && elSeal.value) || 'N/A';
    var elLeak = document.getElementById('fqcLeak');
    result.leakCheck = (elLeak && elLeak.value) || 'N/A';
    var elLabel = document.getElementById('fqcLabel');
    result.labelCheck = (elLabel && elLabel.value) || 'N/A';
    var elPrint = document.getElementById('fqcPrint');
    result.printCheck = (elPrint && elPrint.value) || 'N/A';
    var elCarton = document.getElementById('fqcCarton');
    result.cartonCheck = (elCarton && elCarton.value) || 'N/A';
    var elAppearance = document.getElementById('fqcAppearance');
    result.appearanceCheck = (elAppearance && elAppearance.value) || 'N/A';
    result.visualCheck = elAppearance && elAppearance.value ? elAppearance.value : (elSeal && elSeal.value ? elSeal.value : 'N/A');
    var elComment = document.getElementById('fqcComment');
    result.comment = (elComment && elComment.value) || '';
    if(crm.fqcExtra && crm.fqcExtra.length > 0) {
      crm.fqcExtra.forEach(function(extra, idx) {
        if(extra.status === 'Required') {
          var elExtra = document.getElementById('fqcExtra_' + idx);
          if(elExtra) result['extra_' + idx] = elExtra.value;
        }
      });
    }
    if(approve) {
      var missing = [];
      if(getSpecStatus(crm, 'fqcWeightStatus') === 'Required' && (!elWeight || !elWeight.value)) missing.push('Weight Check');
      if(getSpecStatus(crm, 'fqcSealStatus') === 'Required' && (!elSeal || !elSeal.value)) missing.push('Seal Integrity');
      if(getSpecStatus(crm, 'fqcLeakStatus') === 'Required' && (!elLeak || !elLeak.value)) missing.push('Leak Test');
      if(getSpecStatus(crm, 'fqcLabelStatus') === 'Required' && (!elLabel || !elLabel.value)) missing.push('Label Verification');
      if(getSpecStatus(crm, 'fqcPrintStatus') === 'Required' && (!elPrint || !elPrint.value)) missing.push('Print Quality');
      if(getSpecStatus(crm, 'fqcCartonStatus') === 'Required' && (!elCarton || !elCarton.value)) missing.push('Carton Condition');
      if(getSpecStatus(crm, 'fqcAppearanceStatus') === 'Required' && (!elAppearance || !elAppearance.value)) missing.push('Appearance Check');
      if(missing.length > 0) { toast('Complete all Required checks: ' + missing.join(', '), 'warning'); return; }
    }
    var finalqcData = lsGet(STORE.finalqc) || {};
    finalqcData[batch.id] = result;
    lsSet(STORE.finalqc, finalqcData);
    if(approve) {
      batch.stage = 7;
      lsSet(STORE.batches, appData.batches);
      renderStageBar();
      goStage(7);
      toast('Final QC approved', 'success');
    } else {
      toast('Batch rejected / held', 'danger');
    }
  } catch(e) { console.error('saveFinalQC error:', e); toast('Error', 'danger'); }
}

    } else {

    }
    el.innerHTML = html;

function completeDispatch() {
  try {
    var batch = getSelectedBatch();
    if(!batch) return;
    var mode = document.getElementById('dsMode').value;
    var carrier = document.getElementById('dsCarrier').value;
    var tracking = document.getElementById('dsTracking').value.trim();
    var special = document.getElementById('dsSpecial').value.trim();
    var date = document.getElementById('dsDate').value;
    var eta = document.getElementById('dsEta').value;
    // Sign-off removed - individual SaaS login
    var dispatchData = lsGet(STORE.dispatch) || {};
    dispatchData[batch.id] = { mode: mode, carrier: carrier, tracking: tracking || '--', special: special || '', date: date, eta: eta || '--', notes: (document.getElementById('dsNotes') || {}).value || '', at: nowISO() };
    lsSet(STORE.dispatch, dispatchData);
    batch.stage = 7;
    batch.status = 'Completed';
    lsSet(STORE.batches, appData.batches);
    renderSidebar();
    renderStageBar();
    goStage(7);
    toast('Batch dispatched', 'success');
  } catch(e) { console.error('completeDispatch error:', e); toast('Error', 'danger'); }
}

// ===== DYNAMIC SPEC FIELDS (Stage 0) =====
// Each dynamic field has: label, status (Required/Not Required), spec value
function addDynamicSpecField(section) {
  try {
    var container = document.getElementById(section + 'ExtraFields');
    if(!container) return;
    var row = document.createElement('div');
    row.className = 'input-row mt-8';
    row.dataset.dynamic = section;
    row.innerHTML = '<div><input type="text" class="dyn-label" placeholder="Field label" style="font-size:12px"></div><div style="display:flex;gap:6px;flex:1"><select class="dyn-status" style="width:120px;padding:4px 8px;font-size:12px;margin:0"><option value="Required">Required</option><option value="Not Required">Not Required</option></select><input type="text" class="dyn-spec" placeholder="Spec value" style="font-size:12px;flex:1;margin:0"><button class="btn btn-danger btn-xs" onclick="this.closest(\'.input-row\').remove()" title="Remove">&times;</button></div>';
    container.appendChild(row);
  } catch(e) { console.error('addDynamicSpecField error:', e); }
}

function renderDynamicSpecFields(section, fields) {
  try {
    var container = document.getElementById(section + 'ExtraFields');
    if(!container || !fields || !fields.length) return;
    container.innerHTML = '';
    fields.forEach(function(f) {
      var row = document.createElement('div');
      row.className = 'input-row mt-8';
      row.dataset.dynamic = section;
      var reqSel = (f.status === 'Required' || !f.status) ? ' selected' : '';
      var nreqSel = f.status === 'Not Required' ? ' selected' : '';
      row.innerHTML = '<div><input type="text" class="dyn-label" placeholder="Field label" value="' + escapeHtml(f.label || '') + '" style="font-size:12px"></div><div style="display:flex;gap:6px;flex:1"><select class="dyn-status" style="width:120px;padding:4px 8px;font-size:12px;margin:0"><option value="Required"' + reqSel + '>Required</option><option value="Not Required"' + nreqSel + '>Not Required</option></select><input type="text" class="dyn-spec" placeholder="Spec value" value="' + escapeHtml(f.spec || f.value || '') + '" style="font-size:12px;flex:1;margin:0"><button class="btn btn-danger btn-xs" onclick="this.closest(\'.input-row\').remove()" title="Remove">&times;</button></div>';
      container.appendChild(row);
    });
  } catch(e) { console.error('renderDynamicSpecFields error:', e); }
}

function collectDynamicSpecFields(section) {
  try {
    var container = document.getElementById(section + 'ExtraFields');
    if(!container) return [];
    var rows = container.querySelectorAll('.input-row[data-dynamic="' + section + '"]');
    var result = [];
    rows.forEach(function(row) {
      var label = row.querySelector('.dyn-label');
      var status = row.querySelector('.dyn-status');
      var spec = row.querySelector('.dyn-spec');
      if(label && (label.value.trim() || (spec && spec.value.trim()))) {
        result.push({ label: label.value.trim(), status: (status && status.value) || 'Required', spec: (spec && spec.value.trim()) || '' });
      }
    });
    return result;
  } catch(e) { console.error('collectDynamicSpecFields error:', e); return []; }
}

function processImportChecklist() {
  try {
    var raw = document.getElementById('importData').value.trim();
    if(!raw) { toast('No data to import', 'warning'); return; }
    var data = {};
    // Try JSON parse first
    try { data = JSON.parse(raw); } catch(je) {
      // Fallback: parse key:value lines
      raw.split(/\n/).forEach(function(line) {
        var m = line.match(/^\s*["\']?([^"\':]+)["\']?\s*[:=]\s*["\']?([^"\']*)["\']?\s*$/);
        if(m) data[m[1].trim().toLowerCase().replace(/\s+/g,'')] = m[2].trim();
      });
    }
    if(!data || Object.keys(data).length === 0) { toast('Could not parse data', 'danger'); return; }
    // Find current order
    var batch = getSelectedBatch();
    if(!batch) { toast('No active order selected', 'danger'); return; }
    var order = appData.orders.find(function(o) { return o.id === batch.orderId; });
    if(!order) { toast('Order not found', 'danger'); return; }
    // Update order fields
    var company = data.company || data.companyname || data.customer;
    var contact = data.contact || data.contactperson || data.person;
    var phone = data.phone || data.phonenumber || data.mobile;
    var email = data.email || data.emailaddress;
    var gst = data.gst || data.gstno || data.gstin;
    var qty = data.qty || data.quantity || data.quantityrequired;
    var deliveryDate = data.deliverydate || data.deliverydaterequired;
    var deliveryAddr = data.deliveryaddress || data.address || data.deliveryaddr;
    var specialReq = data.specialreq || data.specialrequirements || data.requirements;
    var paymentTerms = data.paymentterms || data.payment || data.terms;
    if(company && !order.customerId) order.customer = company; // KYC-anchored orders: name stays inherited
    if(contact) order.contact = contact;
    if(phone) order.contact = (order.contact ? order.contact + ' / ' : '') + phone;
    if(qty) { var n = parseInt(qty); if(!isNaN(n) && n > 0) order.qty = n; }
    if(deliveryDate) order.deliveryDate = deliveryDate;
    if(specialReq) order.notes = (order.notes ? order.notes + '\n' : '') + 'Special: ' + specialReq;
    // Update CRM
    order.crm = order.crm || {};
    if(email) order.crm.chkEmail = email;
    if(gst) order.crm.chkGst = gst;
    if(deliveryAddr) order.crm.chkDeliveryAddr = deliveryAddr;
    if(paymentTerms) order.crm.paymentTerms = paymentTerms;
    if(data.customlabel !== undefined) order.crm.chkCustomLabel = !!data.customlabel;
    if(data.custompkg !== undefined) order.crm.chkCustomPkg = !!data.custompkg;
    if(data.samplerequired !== undefined) order.crm.chkSample = !!data.samplerequired;
    if(data.customLabel !== undefined) order.crm.chkCustomLabel = !!data.customLabel;
    if(data.customPkg !== undefined) order.crm.chkCustomPkg = !!data.customPkg;
    if(data.sampleRequired !== undefined) order.crm.chkSample = !!data.sampleRequired;
    // Try to anchor the order to a universal Customer ID (match imported company against KYC directory)
    syncCustomerLinks();
    lsSet(STORE.orders, appData.orders);
    closeOrderModal();
    toast('Customer checklist imported and order updated' + (order.customerId ? ' — linked to ' + order.customerId : ''), 'success');
    // Re-render stage 0
    renderStage0(document.getElementById('contentInner'), batch);
  } catch(e) { console.error('processImportChecklist error:', e); toast('Error importing: ' + e.message, 'danger'); }
}

function createOrder() {
  try {
    var custIdEl = document.getElementById('noCustomerId');
    var customerId = custIdEl ? custIdEl.value : '';
    var uc = getUniversalCustomer(customerId);
    var customer = (uc ? (uc.name || uc.contact) : document.getElementById('noCustomer').value || '').trim();
    var productId = document.getElementById('noProduct').value;
    var qty = parseInt(document.getElementById('noQty').value);
    if(!customerId || !uc) { toast('Select a universal Customer ID (created in Form-15 KYC)', 'warning'); return; }
    if(!customer || !productId || isNaN(qty) || qty < 1) { toast('Enter customer, product and quantity', 'warning'); return; }
    var cat = getCat(productId);
    if(!cat) { toast('Product not found', 'danger'); return; }
    // Use default batchSize based on product
    var batchSize = 10;
    var nextNum = lsGet(STORE.nextOrderNum) || 1;
    var orderId = 'ORD-26-' + String(nextNum).padStart(4, '0');
    var batchId = 'B-' + Math.random().toString(36).substr(2, 6).toUpperCase();
    var factor = batchSize / 10;
    var container = document.getElementById('noContainer').value || 'Container';
    var leadTime = parseInt(document.getElementById('noLeadTime').value) || 30;
    // Build CRM spec object from modal fields
    var crm = {};
    // QC fields
    var qcMap = [
      ['qcPhysico','noPhysico'],['qcPh','noPh'],['qcViscosity','noViscosity'],['qcDensity','noDensity'],
      ['qcMicrobial','noMicrobial'],['qcTpc','noTpc'],['qcYm','noYm'],['qcPathogen','noPathogen'],
      ['qcSensory','noSensory'],['qcColor','noColor'],['qcOdor','noOdor'],['qcTexture','noTexture']
    ];
    qcMap.forEach(function(m) {
      var sEl = document.getElementById(m[1] + 'Status');
      var spEl = document.getElementById(m[1] + 'Spec');
      if(sEl) crm[m[0] + 'Status'] = sEl.value;
      if(spEl) crm[m[0] + 'Spec'] = spEl.value;
    });
    // Lab fields
    var labMap = [
      ['labStability','noStability'],['labAccelerated','noAccelerated'],['labDuration','noDuration'],
      ['labPreservative','noPreservative'],['labHeavyMetal','noHeavyMetal'],['labDermatological','noDermatological'],
      ['labDocumentation','noDocumentation'],['labCoa','noCoa'],['labMethod','noMethod']
    ];
    labMap.forEach(function(m) {
      var sEl = document.getElementById(m[1] + 'Status');
      var spEl = document.getElementById(m[1] + 'Spec');
      if(sEl) crm[m[0] + 'Status'] = sEl.value;
      if(spEl) crm[m[0] + 'Spec'] = spEl.value;
    });
    // Final QC fields
    var fqcMap = [
      ['fqcWeight','noFqcWeight'],['fqcSeal','noFqcSeal'],['fqcLeak','noFqcLeak'],
      ['fqcLabel','noFqcLabel'],['fqcPrint','noFqcPrint'],['fqcCarton','noFqcCarton'],
      ['fqcAppearance','noFqcAppearance'],['fqcRelease','noFqcRelease']
    ];
    fqcMap.forEach(function(m) {
      var sEl = document.getElementById(m[1] + 'Status');
      var spEl = document.getElementById(m[1] + 'Spec');
      if(sEl) crm[m[0] + 'Status'] = sEl.value;
      if(spEl) crm[m[0] + 'Spec'] = spEl.value;
    });
    // Packaging fields
    var pkgMap = [
      ['pkgContainerType','noPkgContainer'],['pkgCap','noPkgCap'],['pkgSeal','noPkgSeal'],
      ['pkgLabel','noPkgLabel'],['pkgFillWeight','noPkgFill'],['pkgMonoCarton','noPkgMonoCarton'],
      ['pkgIndShrinkWrap','noPkgShrinkWrap'],['pkgLeaflet','noPkgLeaflet'],['pkgInnerPacking','noPkgInner'],
      ['pkgOuterCarton','noPkgOuter'],['pkgUnitsPerCarton','noPkgUnitsPerCarton'],
      ['pkgOuterShrinkWrap','noPkgOuterShrink'],['pkgPalletInfo','noPkgPallet'],['pkgSpecialHandling','noPkgSpecial']
    ];

      stage: 1, stepsCompleted: [0,0,0,0,0,0,0,0], status: 'In Progress', createdAt: nowISO()
    };
    appData.orders.push(order);

    lsSet(STORE.orders, appData.orders);
    lsSet(STORE.batches, appData.batches);
    lsSet(STORE.nextOrderNum, nextNum + 1);

    toast('Order ' + orderId + ' created', 'success');
    selectOrder(orderId);
  } catch(e) { console.error('createOrder error:', e); toast('Error creating order', 'danger'); }
}

// ===== INIT =====
function init() {
  try {
    // Clear old version data — SCOPED to production-hub keys only.
    // NEVER localStorage.clear(): the Form-15 workflow shares this browser's storage (one ledger, two files).
    var storedVersion = localStorage.getItem('backero_data_version');
    if(storedVersion !== 'v8') {
      if(storedVersion) { // purge ONLY when upgrading from an older tracked version — a fresh
        Object.keys(STORE).forEach(function(k) { try { localStorage.removeItem(STORE[k]); } catch(e) {} }); // browser may already hold Form-15 orders
        try { localStorage.removeItem('backero_v6_runtime_catalog'); } catch(e) {}
      }
      localStorage.setItem('backero_data_version', 'v8');
    }
    // Re-read after potential clear
    appData.orders = lsGet(STORE.orders);
    appData.batches = lsGet(STORE.batches);
    // One-time migration: stage order changed (Work Assignment ⇄ Procurement) — swap stored 1↔2 once
    if(!localStorage.getItem('backero_stage_order_v2') && Array.isArray(appData.batches)) {
      appData.batches.forEach(function(b) {
        if(b && b.stage === 1) b.stage = 2;
        else if(b && b.stage === 2) b.stage = 1;
      });
      lsSet(STORE.batches, appData.batches);
      localStorage.setItem('backero_stage_order_v2', 'done');
    }
    // Seed demo data ONLY when there are no orders at all — orders arriving from the
    // Form-15 shared Orders tab must never be overwritten by demo seeds.
    var hasValidOrders = Array.isArray(appData.orders) && appData.orders.length > 0;
    if(!hasValidOrders) {
      var seeded = seedData();
      appData.orders = seeded.orders;
      appData.batches = seeded.batches;
    } else if(!Array.isArray(appData.batches)) {
      appData.batches = [];
    }
    // Universal Customer ID: link every order to the Form-15 KYC master record
    var linkedCount = syncCustomerLinks();
    if(linkedCount > 0) console.log('Customer ID link: ' + linkedCount + ' order(s) anchored to universal Customer IDs');
    if(CURRENT_OPERATOR) { var opInput = document.getElementById('currentOperator'); if(opInput) opInput.value = CURRENT_OPERATOR; }
    document.getElementById('headerNewOrderBtn').style.display = 'inline-flex';
    showDashboard();
    updateClock();
    setInterval(updateClock, 1000);
  } catch(e) { console.error('Init error:', e); document.getElementById('contentInner').innerHTML = '<div class="card">Init error: ' + escapeHtml(e.message) + '</div>'; }
}

// Cross-tab live sync: the Form-15 workflow creates/updates orders in the SAME shared stores
// from another browser tab — reload them and re-render so both files always show one ledger.
window.addEventListener('storage', function(e) {
  if(!e || (e.key !== STORE.orders && e.key !== STORE.batches && e.key !== 'backero_v6_runtime_catalog' && e.key !== CUST_DB_KEY)) return;
  var o = lsGet(STORE.orders); var b = lsGet(STORE.batches);
  if(Array.isArray(o)) appData.orders = o;
  if(Array.isArray(b)) appData.batches = b;
  syncCustomerLinks(); // KYC edits in Form-15 reflect here immediately
  try { if(selectedOrderId) { selectOrder(selectedOrderId); } else { showDashboard(); } } catch(err) {}
});

// Start
init();
</script>
